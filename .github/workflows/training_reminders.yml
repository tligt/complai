name: Training Reminders

on:
  schedule:
    - cron: '23 7 * * 1'   # Mondays 07:23 UTC — the job itself sends at most monthly per company
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

jobs:
  training:
    name: Email training due reminders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests supabase python-dotenv

      - name: Run training reminders
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY:        ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL:     ${{ secrets.BREVO_FROM_EMAIL }}
          BREVO_FROM_NAME:      ${{ secrets.BREVO_FROM_NAME }}
          APP_BASE_URL:         ${{ secrets.APP_BASE_URL }}
          NOTIFY_ENABLED:       'true'
        run: |
          python monitor_training.py

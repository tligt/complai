name: Regulatory Monitoring

# Schedule removed 13 Nov (D-174): both jobs now run on production's own
# crontab instead, once Compliance Pulse's source moved there — one
# pipeline, not two running against two databases. Kept as workflow_dispatch
# only, for a manual dev-only run if one's ever needed.
on:
  workflow_dispatch:

jobs:
  regulatory:
    name: Run Regulatory Monitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests supabase python-dotenv beautifulsoup4

      - name: Run regulatory monitor
        env:
          MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          QDRANT_URL:           ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY:       ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION:    ${{ secrets.QDRANT_COLLECTION }}
        run: |
          python monitor.py

  marketing:
    name: Run Marketing Monitor
    runs-on: ubuntu-latest
    needs: regulatory        # Run after regulatory to avoid parallel Mistral rate limits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests supabase python-dotenv beautifulsoup4

      - name: Run marketing monitor
        env:
          MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python monitor_marketing.py

# D-209: limits for the systemd journal, which now holds the apps' logs
# (docker-compose.yml, logging driver journald). Installed by update.sh to
# /etc/systemd/journald.conf.d/recosa.conf.
#
# Persistent on disk; at most 2 GB in all, and nothing older than 90 days:
# the logs can hold e-mail addresses and IP addresses, so they are not kept
# longer than troubleshooting needs.
[Journal]
Storage=persistent
SystemMaxUse=2G
MaxRetentionSec=90day

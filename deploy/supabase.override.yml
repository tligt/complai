# Applied on top of the official self-hosted Supabase compose file
# (bootstrap.sh copies it next to it as docker-compose.override.yml).
#
# The official file publishes the API gateway (8000) and the pooler
# (5432/6543) on every interface. Docker writes its own iptables rules, so
# a host firewall (ufw) does NOT stop that — the Scaleway security group is the
# real perimeter, and this file is the second lock: everything is bound to
# 127.0.0.1, reachable over an SSH tunnel, and the public path is Caddy → Kong
# on the internal network only.
#
# `!override` replaces the list instead of appending to it (Docker Compose
# 2.24.4+). After `docker compose up`, the runbook checks with `ss -tlnp` that
# nothing but 22, 80 and 443 listens publicly — service names drift between
# Supabase versions, and that check is what proves this file still matches.

# 12 Nov (D-172): Supabase replaced Kong with Envoy ("api-gw", still answering
# to the name "kong" on its network) and made Logflare optional
# (docker-compose.logs.yml, not used). Its .env now sets COMPOSE_FILE, which
# turns off the automatic override: supabase_env.py adds this file to it.

services:
  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000"

  supavisor:
    ports: !override
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6543:6543"

  # The password-reset and sign-up confirmation emails link back to the app
  # as ?token_hash=…&type=recovery / type=email, which the app can read —
  # Supabase's default links put the session in a #fragment Streamlit never
  # sees (D-127, D-139). The templates are deploy/email-templates/*.html,
  # served by RECOSA's Caddy on the shared network (http://caddy:8080, not
  # public).
  auth:
    environment:
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://caddy:8080/recovery.html
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Reset your RECOSA password
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://caddy:8080/confirmation.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirm your email for RECOSA

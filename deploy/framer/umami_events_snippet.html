     D-180, 16 Nov 2026. Copied from the live site after publishing; this file is
     the reference copy - change it here, then paste it into Framer. -->
<script>
/* RECOSA — Umami click and form events (D-180). Names a click by where the
   link goes, so no per-button setup: every page, breakpoint and component. */
(function () {
  if (!/^(www\.)?recosa\.eu$/.test(location.hostname)) return; // not in Framer previews

  var GENERIC = /^(button|link|text|icon|stack|frame|container|wrapper|content|variant)/i;

  function eventFor(url) {
    var h = url.hostname, p = url.pathname;
    if (h === "check.recosa.eu") return "cta_free_check";
    if (h === "app.recosa.eu") return url.searchParams.has("signup") ? "cta_signup" : "cta_login";
    if (h === "recosa.eu" || h === "www.recosa.eu") {
      if (p === "/pricing") return "cta_pricing";
      if (p === "/waitlist") return "cta_waitlist";
      if (p === "/contact") return "cta_contact";
      if (p === "/compliance-pulse" || p.indexOf("/pulse/") === 0) return "cta_pulse";
    }
    return null;
  }

  function where(el) {
    if (el.closest("nav, header")) return "nav";
    if (el.closest("footer")) return "footer";
    for (var n = el.parentElement; n && n !== document.body; n = n.parentElement) {
      var name = n.getAttribute("data-framer-name");
      if (name && !GENERIC.test(name)) return name.slice(0, 40);
    }
    return "page";
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a || !window.umami) return;
    var url;
    try { url = new URL(a.href, location.href); } catch (_) { return; }
    var name = eventFor(url);
    if (!name) return;

    var data = { location: url.searchParams.get("src") || where(a), page: location.pathname };
    var plan = url.searchParams.get("signup");
    if (plan && plan !== "1") data.plan = plan;

    var leaving = url.hostname !== location.hostname;
    var newTab = a.target === "_blank" || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0;
    if (leaving && !newTab && !e.defaultPrevented) {
      // Leaving for the check or the app: give the event up to 400 ms to go out.
      e.preventDefault();
      var done = false;
      var go = function () { if (!done) { done = true; location.href = url.href; } };
      setTimeout(go, 400);
      Promise.resolve(window.umami.track(name, data)).then(go, go);
    } else {
      window.umami.track(name, data);
    }
  }, true);

  document.addEventListener("submit", function () {
    if (!window.umami) return;
    var p = location.pathname;
    var name = p === "/waitlist" ? "waitlist_submit"
             : p.indexOf("/contact") === 0 ? "contact_submit" : "form_submit";
    window.umami.track(name, { page: p });
  }, true);
})();
</script>
